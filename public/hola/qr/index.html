<script>
(function(){
  var std=document.getElementById('qr-std'), ar=document.getElementById('qr-ar'),
      urlEl=document.getElementById('qr-url'), dlEl=document.getElementById('qr-dl'),
      titleEl=document.getElementById('qr-title'), tabs=document.querySelectorAll('[data-qr-mode]');
  function setMode(m){
    tabs.forEach(function(t){t.classList.toggle('active',t.getAttribute('data-qr-mode')===m)});
    if(m==='ar'){
      if(std)std.hidden=true;
      if(ar)ar.hidden=false;
      if(urlEl)urlEl.textContent='damelaletra.com/hola?ar=1';
      if(dlEl)dlEl.href='/hola/qr/dame-la-letra-qr-ar.png';
      if(titleEl)titleEl.innerHTML='Escanea y <span>flota en AR.</span>';
    }else{
      if(std)std.hidden=false;
      if(ar)ar.hidden=true;
      if(urlEl)urlEl.textContent='damelaletra.com/hola';
      if(dlEl)dlEl.href='/hola/qr/dame-la-letra-qr.png';
      if(titleEl)titleEl.innerHTML='Escanea y <span>hablemos.</span>';
    }
  }
  tabs.forEach(function(t){t.addEventListener('click',function(){setMode(t.getAttribute('data-qr-mode'))})});
  setMode('ar');

  var lock=null, msg=document.querySelector('.awake');
  function req(){ if(!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function(l){lock=l;msg.textContent='Pantalla activa mientras muestras el QR';l.addEventListener('release',function(){msg.textContent=''})}).catch(function(){});
  }
  req();
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') req(); });
  document.addEventListener('click',function(){ if(!lock) req(); },{once:true});
})();
</script>
